name: CI probe tests

on:
  push:
    branches: [ 'claude/ci-probe-*' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew --continue :composeApp:testAndroidHostTest --tests '*LocalPlayerAdapterTest*'
      - name: Print test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in r.iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      print('=====', tc.get('classname'), '>', tc.get('name'))
                      print((fl.text or '')[:6000])
          PY
