name: CI probe tests

on:
  push:
    branches: [ 'claude/ci-probe-*' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew --continue :androidApp:testDebug testAndroidHostTest
