name: Build dev APK

# Builds an installable APK from the integration branch (all open PR branches merged)
# and publishes it to the rolling `dev-build` prerelease, so a phone can always fetch
# the newest build from one stable URL:
# https://github.com/<owner>/<repo>/releases/download/dev-build/music-assistant-dev.apk

on:
  push:
    branches: [ integration ]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time; a newer push replaces a build that is still running.
concurrency:
  group: build-dev-apk
  cancel-in-progress: true

env:
  RELEASE_TAG: dev-build
  APK_NAME: music-assistant-dev.apk
  KEYSTORE_PATH: ~/.android/debug.keystore
  KEYSTORE_CACHE_KEY: dev-apk-keystore-v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Short commit sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The selfSignedRelease build type signs with ~/.android/debug.keystore. The key must
      # stay the same from run to run, or the phone refuses to install the build as an
      # update. Order of sources: the DEV_KEYSTORE_BASE64 secret, then the Actions cache,
      # then a newly generated key (which is saved to the cache).
      - name: Restore signing key from secret
        id: secret_key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEV_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Signing key restored from the DEV_KEYSTORE_BASE64 secret."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key from cache
        id: cache_key
        if: steps.secret_key.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KEYSTORE_PATH }}
          key: ${{ env.KEYSTORE_CACHE_KEY }}

      - name: Generate signing key
        id: gen_key
        if: steps.secret_key.outputs.found != 'true' && steps.cache_key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          if [ -f ~/.android/debug.keystore ]; then
            echo "A keystore already exists on the runner; keeping it."
          else
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Save signing key to cache
        if: steps.gen_key.outputs.generated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KEYSTORE_PATH }}
          key: ${{ env.KEYSTORE_CACHE_KEY }}

      - name: Remind about a permanent signing key
        if: steps.secret_key.outputs.found != 'true'
        run: |
          echo "::notice title=Signing key not permanent::The dev APK is signed with a key kept in the Actions cache, which GitHub evicts after 7 days without use. When it is evicted, the next build gets a new key and the phone must uninstall the app before it installs the build. To make the key permanent, create a keystore locally (keytool -genkeypair -keystore dev.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'), then store its base64 as the repository secret DEV_KEYSTORE_BASE64 (base64 -w0 dev.keystore | gh secret set DEV_KEYSTORE_BASE64). Changing to that key needs one uninstall."

      # A minified release build: a debug build of Compose is much slower and would
      # mislead performance testing.
      - name: Build APK
        run: ./gradlew :androidApp:assembleSelfSignedRelease

      - name: Collect APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/selfSignedRelease/*arm64-v8a*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            apks=(androidApp/build/outputs/apk/selfSignedRelease/*.apk)
          fi
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APK found under androidApp/build/outputs/apk/selfSignedRelease/"
            exit 1
          fi
          echo "Built APKs: ${apks[*]}"
          mkdir -p dist
          cp "${apks[0]}" "dist/$APK_NAME"
          echo "path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-dev-${{ steps.sha.outputs.short }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Write release notes
        run: |
          {
            echo "Rolling dev build of \`${GITHUB_REF_NAME}\`. Not a release."
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Merged on top of main:"
            echo
            echo '```'
            git log --oneline --first-parent origin/main..HEAD
            echo '```'
          } > dist/release-notes.md
          cat dist/release-notes.md

      - name: Publish to the dev-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Dev build ${{ steps.sha.outputs.short }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$TITLE" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --latest=false
            # Drop every old asset, then upload the new APK under the stable name.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$RELEASE_TAG" "$asset" -y
              done
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file dist/release-notes.md \
              --prerelease \
              --latest=false
          fi
          echo "::notice title=Dev APK published::https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"

      # Runs after the APK is published, so a failing test is visible but never blocks
      # getting a build onto the phone.
      - name: Run tests
        continue-on-error: true
        run: ./gradlew :androidApp:testDebug testAndroidHostTest
